[project]
name = "myoInteract"
version = "1.0.0"
description = "Teach a muscle-driven user model to interact with your interface"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "Ankit Bhattarai" },
    { name = "Hannah Selder" },
    { name = "Florian Fischer" },
    { name = "Arthur Fleig" },
    { name = "Per Ola Kristensson" },
]
dependencies = [
    # MyoSuite 3 from PyPI (tests and a policy rollout pass on 3.0.0).
    "myosuite>=3.0.0",
    # CPU Studio supports newer 3.x engines. Optional training backends constrain
    # their own compatible engine/Warp combination through their dependencies.
    "mujoco>=3.11,<4",
    "hydra-core>=1.3.7",
    "omegaconf>=2.3.1",
]

[project.optional-dependencies]
# Same mjlab-facing stack as myosuite[mjlab]; resolved together so torch / warp / mjlab stay compatible.
mjlab = [
    "myosuite[mjlab]>=3.0.0; python_version < '3.14' and sys_platform != 'win32'",
    # No upper cap: tyro 1.0.14+ needs NoisyMyoMuscleActivationActionCfg without **kwargs (fixed).
    "tyro>=1.0.14",
    # rsl_rl (via mjlab) passes wandb.Settings(start_method=...), which wandb>=0.29.0 rejects with a
    # pydantic ValidationError on the first training iteration. Same cap as myosuite[mjlab].
    "wandb>=0.22.3,<0.29.0; python_version >= '3.10' and sys_platform != 'win32'",
]
ui = [
    # The two-thumb range slider is myoInteract.scripts.range_slider (gradio-rangeslider is unmaintained and needs gradio<6).
    "gradio>=6.0,<7.0; python_version >= '3.10' and python_version < '3.14' and sys_platform != 'win32'",
    # viser/mjviser come with myosuite[mjlab]; re-declaring a version here would conflict with its pin.
]
# Studio backend (myo_studio serve): the web app and its HTTP API.
studio = [
    "fastapi>=0.110",
    "httpx>=0.27",  # Studio's HTTP viewer proxy
    "psutil>=5.9",  # Cross-platform process liveness without signal probing
    "uvicorn>=0.29",
    "websockets>=13",  # Studio: live 3D feed of the stream worker
]
rl = [
    "wandb>=0.22.3,<0.29.0; python_version >= '3.10' and sys_platform != 'win32'",
]
# Colab: the UI and Studio plus GPU training (Colab ships torch; mjlab pulls the matching warp).
colab = ["myoInteract[ui,mjlab,studio]"]
all = ["myoInteract[ui,mjlab,rl,studio]"]
dev = [
    "myosuite[dev]>=3.0.0",
    "myoInteract[mjlab,ui,rl,studio]",
    "pytest>=8.0.0",
    "httpx",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

# myo_config/ and myo_user/ (task configs, models, meshes) are no packages; as namespace packages
# they are installed next to myoInteract/, where the code looks them up (<package root>/../myo_*).
[tool.setuptools.packages.find]
include = ["myoInteract", "myoInteract.*", "myo_config", "myo_config.*", "myo_user", "myo_user.*"]
namespaces = true

[tool.setuptools.package-data]
"myoInteract" = ["**/*"]
"myo_config" = ["**/*"]
"myo_user" = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]

[project.scripts]
myo_train = "myoInteract.scripts.train:main"
myo_play = "myoInteract.scripts.ui:main"
myo_studio = "myoInteract.studio.server:main"

[project.urls]
Studio = "https://myointeract.github.io/studio/"
Repository = "https://github.com/MyoInteract/MyoInteract"
Paper = "https://doi.org/10.1145/3800645.3812899"

[tool.pytest.ini_options]
addopts = ["-m", "not slow"]
markers = [
    "slow: Slow-running tests (benchmarks, long rollouts, or heavy external deps).",
]

[tool.ruff]
extend-exclude = ["tutorials"]

[tool.ruff.lint.per-file-ignores]
# package __init__ files re-export their modules' public names
"__init__.py" = ["F401"]
