name: MyoInteract tests

on:
  push:
    branches: [master, main, dev, 'codex/**']
  pull_request:
    branches: [master, main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
      GRADIO_ANALYTICS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked CPU test environment
        run: |
          python -m pip install uv
          uv sync --frozen --extra test
      - name: Prepare import-time Playground metadata
        run: uv run --frozen --extra test python scripts/prepare_test_assets.py
      - name: Run MyoInteract regression tests
        run: uv run --frozen --extra test pytest -q --timeout=300
      - name: Check Python errors
        run: uv run --frozen --extra test ruff check myosuite/envs/myo/myouser myosuite/train myosuite/benchmarks myosuite/utils/run_manifest.py myosuite/tests scripts tests
      - name: Build wheel and source distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: uv run --frozen --extra test python -m build
      - name: Verify installed wheel resources from another directory
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: uv run --frozen --extra test python scripts/check_wheel.py dist

  task-benchmark:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --frozen --extra test
      - run: uv run --frozen --extra test python scripts/prepare_test_assets.py
      - name: Evaluate all three tasks with a bounded CPU smoke protocol
        run: uv run --frozen --extra test myointeract-benchmark --policy zero --seeds 0 --episodes 1 --max-steps 2 --output benchmark-results/cpu-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-task-benchmark
          path: benchmark-results/cpu-smoke.json
